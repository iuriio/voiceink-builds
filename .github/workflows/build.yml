name: Build VoiceInk

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch, tag or commit"
        required: false
        default: "main"
      force:
        description: "Build even if this commit was already built"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-voiceink
  cancel-in-progress: false

env:
  UPSTREAM: Beingpax/VoiceInk
  FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/appcast.xml
  SPARKLE_PUBLIC_KEY: n6drMeCV7FsKUc2f5lRdn/4nu4D75M6sJJIW+Kf9enI=
  KEEP_RELEASES: "10"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Keep scheduled workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/enable" || true

      - name: Compare upstream with last build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(gh api "repos/$UPSTREAM/commits/$REF" --jq .sha)
          last=$(cat last-built-sha 2>/dev/null || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && [ "$sha" = "$last" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Upstream $REF ($sha) already built"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $REF at $sha (last built: ${last:-none})"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout upstream VoiceInk
        uses: actions/checkout@v4
        with:
          repository: Beingpax/VoiceInk
          ref: ${{ needs.check.outputs.sha }}
          path: upstream
          fetch-depth: 0

      - name: Select newest stable Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache whisper.xcframework
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple/whisper.xcframework
          key: whisper-xcframework-${{ steps.xcode.outputs.version }}-v1

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "VoiceInk Local Signing" -p "$KC" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/signing.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk '/VoiceInk Local Signing/ { print $2; exit }')
          [ -n "$IDENTITY" ] || { security find-identity -p codesigning "$KC"; echo "Signing identity not found"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Point Sparkle at this repo
        working-directory: upstream
        run: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :SUFeedURL $FEED_URL" VoiceInk/Info.plist
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $SPARKLE_PUBLIC_KEY" VoiceInk/Info.plist
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" VoiceInk.xcodeproj/project.pbxproj

      - name: Build (make local)
        working-directory: upstream
        run: make local LOCAL_CODESIGN_IDENTITY="$IDENTITY"

      - name: Verify app
        run: |
          APP="$HOME/Downloads/VoiceInk.app"
          PLIST="$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Identifier|Authority"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$PLIST")" = "$FEED_URL" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$PLIST")" = "$SPARKLE_PUBLIC_KEY" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER" ]
          MARKETING=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          SHORT_SHA=${SHA:0:7}
          echo "MARKETING=$MARKETING" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "TAG=v$MARKETING-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Package (zip for Sparkle, DMG for manual install)
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$HOME/Downloads/VoiceInk.app" VoiceInk.zip
          mkdir -p dmg
          ditto "$HOME/Downloads/VoiceInk.app" dmg/VoiceInk.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname "VoiceInk $MARKETING" -srcfolder dmg -ov -format UDZO VoiceInk.dmg
          shasum -a 256 VoiceInk.zip VoiceInk.dmg | tee SHA256SUMS

      - name: Sign update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE=$(find upstream/.local-build/SourcePackages/artifacts -type f -name sign_update -perm -u+x | head -1)
          [ -n "$SIGN_UPDATE" ] || { echo "sign_update not found"; exit 1; }
          printf %s "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed.key"
          SIGNATURE=$("$SIGN_UPDATE" --ed-key-file "$RUNNER_TEMP/ed.key" VoiceInk.zip)
          rm -f "$RUNNER_TEMP/ed.key"
          echo "$SIGNATURE"
          echo "$SIGNATURE" | grep -q 'sparkle:edSignature=' || exit 1
          echo "SPARKLE_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(cat self/last-built-sha 2>/dev/null || true)
          {
            echo "Build of [Beingpax/VoiceInk@$SHORT_SHA](https://github.com/$UPSTREAM/commit/$SHA) (LOCAL_BUILD, self-signed, Sparkle feed from this repo)."
            echo
            echo "Source: https://github.com/$UPSTREAM/tree/$SHA (only \`SUFeedURL\`, \`SUPublicEDKey\` and build number changed)."
            echo
            echo "### Upstream changes"
            if [ -n "$LAST" ] && git -C upstream cat-file -e "$LAST" 2>/dev/null; then
              git -C upstream log --no-merges --format='- %s (%h)' "$LAST..$SHA" | head -60
            else
              git -C upstream log --no-merges --format='- %s (%h)' -20 "$SHA"
            fi
          } > notes.md
          # HTML list of the same changes for the in-app Sparkle window
          {
            echo "<h3>VoiceInk $MARKETING ($SHORT_SHA)</h3><ul>"
            grep '^- ' notes.md | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/^- \(.*\)$/<li>\1<\/li>/'
            echo "</ul>"
          } > "$RUNNER_TEMP/notes.html"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" VoiceInk.zip VoiceInk.dmg SHA256SUMS \
            -R "$GITHUB_REPOSITORY" --target main --title "VoiceInk $MARKETING ($SHORT_SHA)" --notes-file notes.md --latest

      - name: Update appcast
        working-directory: self
        run: |
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>VoiceInk (self-built)</title>
              <item>
                <title>VoiceInk $MARKETING ($SHORT_SHA)</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$MARKETING ($SHORT_SHA)</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG</sparkle:fullReleaseNotesLink>
                <description><![CDATA[$(cat "$RUNNER_TEMP/notes.html")]]></description>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/VoiceInk.zip" type="application/octet-stream" $SPARKLE_SIGNATURE/>
              </item>
            </channel>
          </rss>
          EOF
          echo "$SHA" > last-built-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml last-built-sha
          git commit -m "Build $TAG"
          git push

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
          while read -r tag; do
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag -y
          done

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
