name: Check iCloud sync patch

# Compiles upstream VoiceInk with patches/icloud-sync applied, without signing or
# publishing anything. Runs when the patch changes, or by hand against any upstream ref.

on:
  push:
    paths:
      - "patches/**"
      - ".github/workflows/check-patch.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch, tag or commit"
        required: false
        default: "main"

concurrency:
  group: check-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout upstream VoiceInk
        uses: actions/checkout@v4
        with:
          repository: Beingpax/VoiceInk
          ref: ${{ inputs.ref || 'main' }}
          path: upstream

      - name: Select newest stable Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Same key as build.yml, so the framework built there is reused.
      - name: Cache whisper.xcframework
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple/whisper.xcframework
          key: whisper-xcframework-${{ steps.xcode.outputs.version }}-v1

      - name: Add iCloud Drive sync
        run: self/patches/icloud-sync/apply.sh upstream

      - name: Compile (make local, arm64, ad-hoc signed)
        working-directory: upstream
        run: |
          set -o pipefail
          make local 2>&1 | tee build.log || {
            echo "::group::Compiler errors"
            grep -E "error:" build.log | sort -u | head -50
            echo "::endgroup::"
            grep -E "\.swift:[0-9]+:[0-9]+: error:" build.log | sort -u | head -20 |
              sed -E 's#^.*/upstream/##; s#^#::error::#'
            exit 1
          }
          echo "Upstream $(git rev-parse --short HEAD) compiles with the iCloud sync patch" >> "$GITHUB_STEP_SUMMARY"
